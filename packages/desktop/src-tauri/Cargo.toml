[package]
name = "harness-desktop"
version = "0.1.15"
edition = "2024"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
harness-bootstrap = { path = "../../../native/bootstrap" }
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
tauri-plugin-decoration = "=3.0.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
dunce = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
