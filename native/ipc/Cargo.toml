[package]
name = "harness-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
harness-bootstrap = { path = "../bootstrap" }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
