name: Test published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release to check (without v)
        required: true
        default: "0.1.3"
      previous:
        description: Older published CLI to update (without v)
        required: true
        default: "0.1.2"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows-x64, suffix: .exe }
          - { runner: ubuntu-22.04, target: linux-x64, suffix: "" }
          - { runner: macos-15, target: macos-arm64, suffix: "" }
          - { runner: macos-15-intel, target: macos-x64, suffix: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      PREVIOUS: ${{ inputs.previous }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set isolated test home
        run: echo "HARNESS_HOME=$RUNNER_TEMP/harness-release-check" >> "$GITHUB_ENV"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 libfuse2
      - name: Download the previous CLI
        run: |
          curl -fL "https://github.com/usatiuk/harness/releases/download/v$PREVIOUS/harness-${{ matrix.target }}${{ matrix.suffix }}" -o "$RUNNER_TEMP/harness${{ matrix.suffix }}"
          chmod +x "$RUNNER_TEMP/harness${{ matrix.suffix }}"
      - name: Install Windows desktop on this hosted runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'desktop-installer.exe'
          Invoke-WebRequest "https://github.com/usatiuk/harness/releases/download/v$env:VERSION/harness-v$env:VERSION-windows-x64-desktop.exe" -OutFile $installer
          $destination = Join-Path $env:RUNNER_TEMP 'installed-desktop'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$destination" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          "DESKTOP=$destination/harness-desktop.exe" >> $env:GITHUB_ENV
      - name: Install Unix desktop on this hosted runner
        if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/usatiuk/harness/releases/download/v$VERSION/harness-v$VERSION"
          if [[ "$RUNNER_OS" == Linux ]]; then
            curl -fL "$base-linux-x64-glibc-desktop.AppImage" -o desktop.AppImage
            chmod +x desktop.AppImage
            ./desktop.AppImage --appimage-extract > /dev/null
            echo "DESKTOP=$RUNNER_TEMP/squashfs-root/usr/bin/harness-desktop" >> "$GITHUB_ENV"
          else
            curl -fL "$base-${{ matrix.target }}-desktop.dmg" -o desktop.dmg
            hdiutil attach desktop.dmg -nobrowse -mountpoint "$RUNNER_TEMP/desktop-volume"
            cp -R "$RUNNER_TEMP/desktop-volume/Harness.app" "$RUNNER_TEMP/Harness.app"
            hdiutil detach "$RUNNER_TEMP/desktop-volume"
            echo "DESKTOP=$RUNNER_TEMP/Harness.app/Contents/MacOS/harness-desktop" >> "$GITHUB_ENV"
          fi
      - name: Prepare a fresh SSH account on this hosted runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openssh-server
          sudo useradd --create-home --shell /bin/bash --password '*' harness-release-test
          # GitHub's inherited home ACL grants runner write access, overriding umask.
          sudo setfacl --remove-all --remove-default /home/harness-release-test
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ssh-identity"
          sudo install -d -m 700 -o harness-release-test -g harness-release-test /home/harness-release-test/.ssh
          sudo install -m 600 -o harness-release-test -g harness-release-test "$RUNNER_TEMP/ssh-identity.pub" /home/harness-release-test/.ssh/authorized_keys
          sudo systemctl start ssh
          mkdir -p ~/.ssh
          sudo awk '{print "127.0.0.1 " $1 " " $2}' /etc/ssh/ssh_host_ed25519_key.pub > "$RUNNER_TEMP/ssh-known-hosts"
          cat >> ~/.ssh/config <<EOF
          Host harness-release-test
            HostName 127.0.0.1
            User harness-release-test
            IdentityFile $RUNNER_TEMP/ssh-identity
            IdentitiesOnly yes
            UserKnownHostsFile $RUNNER_TEMP/ssh-known-hosts
            StrictHostKeyChecking yes
          EOF
          echo 'HARNESS_RELEASE_SSH=harness-release-test' >> "$GITHUB_ENV"
      - name: Check cold startup, signed updates and preserved data
        run: node "$GITHUB_WORKSPACE/scripts/check-published-release.mjs" "$RUNNER_TEMP/harness${{ matrix.suffix }}" "$DESKTOP" "$PREVIOUS" "$VERSION"
