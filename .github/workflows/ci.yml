name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Report runner environment
        run: |
          node -p 'JSON.stringify({ node: process.version, platform: process.platform, arch: process.arch, parallelism: require("node:os").availableParallelism(), memoryMiB: Math.round(require("node:os").totalmem() / 1048576) })'
          npm --version
          rustc --version
      - run: npm ci
      - name: Run repository checks
        run: npm run check -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest-report.json
      - run: node packages/desktop/tools/native.mjs cargo test --manifest-path native/Cargo.toml --locked
      - name: Read the pinned payload Node version
        if: matrix.os == 'ubuntu-22.04-arm'
        id: node-pin
        run: echo "version=$(node -p 'require("./release/node.json").version')" >> "$GITHUB_OUTPUT"
      # .nvmrc tracks the rolling major; payload builds require the exact pinned runtime.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-22.04-arm'
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
      - name: Qualify native ARM64 remote runtime
        if: matrix.os == 'ubuntu-22.04-arm'
        run: |
          test "$(uname -m)" = aarch64
          ldd --version
          node scripts/build-payloads.mjs --remote
          env -u HARNESS_SERVER_SELECTION npm run test:remote
      - name: Upload test report for failed jobs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-report-${{ matrix.os }}
          path: vitest-report.json
          if-no-files-found: ignore
          retention-days: 7
