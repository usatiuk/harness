name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Product version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

concurrency:
  group: harness-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HUSKY: "0"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  prepare:
    name: Check and bump version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install dependencies and check the source
        run: |
          npm ci
          npm run check
      - name: Bump and capture the source version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          npm version "$BUMP" --no-git-tag-version
          version=$(node -p 'require("./package.json").version')
          sed -i -E "s/^version = \"[0-9.]+\"/version = \"$version\"/" native/Cargo.toml packages/desktop/src-tauri/Cargo.toml
          cargo update --workspace --manifest-path native/Cargo.toml
          cargo update --workspace --manifest-path packages/desktop/src-tauri/Cargo.toml
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json native/Cargo.toml native/Cargo.lock packages/desktop/src-tauri/Cargo.toml packages/desktop/src-tauri/Cargo.lock
          git commit -m "Bump version to $version"
          git tag "v$version"
          git push --atomic origin HEAD:main "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows-x64 }
          - { runner: ubuntu-22.04, target: linux-x64-glibc }
          - { runner: macos-15, target: macos-arm64 }
          - { runner: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Set up Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            packages/desktop/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build native payloads and signed desktop updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          if [[ "$RUNNER_OS" == Windows ]]; then
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/desktop/tools/native.ps1 'C:/Program Files/Git/bin/bash.exe' scripts/release.sh "$TARGET"
          else
            bash scripts/release.sh "$TARGET"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: release/staging/${{ matrix.target }}.tar.gz
          if-no-files-found: error

  draft:
    name: Create release draft
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: release/staging
      - name: Assemble, sign, and upload one release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm ci
          mkdir release/staging/assets
          for archive in release/staging/*.tar.gz; do tar -xzf "$archive" -C release/staging/assets; done
          node --conditions=development --import=tsx scripts/release-metadata.ts release/staging/assets
          npm exec -- tauri signer sign --app-version "$VERSION" release/staging/assets/release.json
          mv release/staging/assets/release.json.sig release/staging/assets/release.json.minisig
          node --conditions=development --import=tsx scripts/release-metadata.ts release/staging/assets --verify
          gh release create "v$VERSION" release/staging/assets/* --repo "$GITHUB_REPOSITORY" --draft --title "Harness $VERSION" --notes "Native builds from ${{ needs.prepare.outputs.commit }}. Publisher signing is not configured."
